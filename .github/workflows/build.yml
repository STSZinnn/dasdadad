
name: Build FrostPVP Reborn

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build plugin and capture errors
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee frost-build.log

      - name: Upload build diagnostics even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrostPVP-v4.3.1-build-log
          path: frost-build.log
          if-no-files-found: warn

      - name: Upload compiled plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrostPVP-Reborn-v4.3.1-diagnostic
          path: build/libs/*.jar
          if-no-files-found: error
